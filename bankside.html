<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Current | Risk desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/ag-grid-community/styles/ag-grid.css"><link rel="stylesheet" href="/vendor/ag-grid-community/styles/ag-theme-quartz.css">
<script src="/vendor/ag-grid-community/dist/ag-grid-community.noStyle.js"></script>
<style>
:root{font-family:Manrope,sans-serif;color:#1d2822;background:#f3f5f2;--ink:#1d2822;--muted:#738078;--line:#dce3dd;--green:#176c4b;--lime:#d4f27a;--red:#b33c31;--mono:'DM Mono',monospace}*{box-sizing:border-box}body{margin:0}.shell{max-width:1320px;margin:auto;padding:25px 32px 50px}.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--line)}.brand{font-size:18px;font-weight:800}.brand b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--lime);color:var(--green);margin-right:8px}.right{display:flex;align-items:center;gap:14px}.right span{font-size:12px;color:var(--muted)}button{font:inherit;cursor:pointer}.quiet{background:#fff;border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-weight:700;font-size:12px;color:var(--ink)}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;padding:28px 0 18px}.eyebrow{font:11px var(--mono);color:var(--green);text-transform:uppercase}.heading h1{font-size:26px;margin:7px 0}.heading p{font-size:12px;color:var(--muted);margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary,.danger{border:0;border-radius:6px;padding:10px 13px;font-weight:800;font-size:12px}.primary{background:var(--ink);color:white}.danger{background:#faeae7;color:var(--red)}.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:25px}.stat{padding:15px 18px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat label{display:block;color:var(--muted);font-size:10px}.stat strong{display:block;font:19px var(--mono);margin-top:8px}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:18px}.tab{border:0;background:none;padding:12px 3px;color:var(--muted);font-size:12px;font-weight:800;border-bottom:2px solid transparent}.tab.active{border-color:var(--green);color:var(--green)}.content{display:none}.content.active{display:block}.loan{background:#fff;border:1px solid var(--line);border-radius:7px;margin:10px 0;padding:17px}.loan-top{display:flex;justify-content:space-between;gap:15px}.loan-id{font:11px var(--mono);color:var(--green)}.loan h2{font-size:15px;margin:6px 0}.meta{font-size:11px;color:var(--muted);line-height:1.65}.badge{align-self:flex-start;border-radius:4px;background:#f1f3ef;padding:5px 8px;font:10px var(--mono);text-transform:uppercase}.recommendation{display:grid;grid-template-columns:130px 1fr;gap:12px;margin-top:14px;padding:13px;background:#f3f6f2;border-left:3px solid #85a98e;font-size:12px;line-height:1.55}.recommendation b{color:var(--green)}.recommendation ul{padding-left:17px;margin:5px 0}.decision{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.decision input{min-width:190px;flex:1;border:1px solid var(--line);border-radius:5px;padding:9px;font:12px Manrope}.empty{padding:30px 5px;color:var(--muted);font-size:13px}.audit-row{display:grid;grid-template-columns:165px 150px minmax(100px,1fr) minmax(120px,2fr);gap:12px;padding:12px 9px;border-bottom:1px solid var(--line);font-size:11px}.audit-row span:first-child,.audit-row span:nth-child(2){font-family:var(--mono)}.pause{padding:14px 16px;background:#fff7e5;border-left:3px solid #d5a746;margin:12px 0 18px;display:flex;justify-content:space-between;align-items:center;gap:15px;font-size:12px}.paused{background:#faeae7;border-color:var(--red)}.msg{font-size:11px;margin-top:8px;color:var(--green)}.msg.error{color:var(--red)}@media(max-width:760px){.shell{padding:16px}.heading{align-items:start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}.recommendation{grid-template-columns:1fr;gap:4px}.audit-row{grid-template-columns:1fr 1fr}.right span{display:none}.loan-top{align-items:start}}
.account-row{display:grid;grid-template-columns:minmax(140px,1fr) minmax(120px,1fr) auto auto;gap:12px;align-items:center;padding:13px 10px;border-bottom:1px solid var(--line);font-size:11px}.account-list{background:white;border:1px solid var(--line);border-radius:7px;padding:12px 16px;margin:12px 0 20px}.account-list h2{font-size:14px}.account-row strong{font:12px var(--mono)}.frozen-label{color:var(--red);font-weight:800}@media(max-width:760px){.account-row{grid-template-columns:1fr 1fr}.account-row button{grid-column:span 2}}
.ag-theme-quartz{height:520px;width:100%;--ag-font-family:Manrope,sans-serif;--ag-font-size:12px;--ag-header-background-color:#edf2ed;--ag-border-color:#dce3dd;--ag-row-hover-color:#f3f6f2}@media(max-width:700px){.ag-theme-quartz{height:600px}}
</style></head><body><div class="shell">
<header class="top"><div class="brand"><b>C</b>current / risk desk</div><div class="right"><span id="identity">Checking access…</span><button class="quiet" onclick="signOut()">Sign out</button></div></header>
<section class="heading"><div><div class="eyebrow">Human operations</div><h1>Review & oversight</h1><p>AI assists with evidence-based reviews. Officers make every lending decision.</p></div><div class="actions"><button class="quiet" onclick="refreshAll()">↻ Refresh</button><a class="quiet" href="bank-storage.html" style="text-decoration:none">Summary</a></div></section>
<div class="stats"><div class="stat"><label>Customer accounts</label><strong id="stat-accounts">0</strong></div><div class="stat"><label>Verified ledger balance</label><strong id="stat-balance">$0.00</strong></div><div class="stat"><label>Pending loan reviews</label><strong id="stat-pending">0</strong></div><div class="stat"><label>Loans disbursed</label><strong id="stat-loans">0</strong></div></div>
<div id="controls"></div><div id="staff-accounts"></div><div class="tabs"><button class="tab active" onclick="showTab('reviews',this)">Loan reviews</button><button class="tab" onclick="showTab('ledger',this)">Transactions</button><button class="tab" onclick="showTab('audit',this)">Audit & decisions</button></div>
<section class="content active" id="reviews"><div id="loan-list"><div class="empty">Loading reviews…</div></div></section><section class="content" id="ledger"><div id="transaction-grid" class="ag-theme-quartz"></div></section><section class="content" id="audit"><div id="audit-list"><div class="empty">Loading audit events…</div></div></section><div id="page-message" class="msg"></div></div>
<script>
const API='/api';let operator=null;let paused=false;
async function api(path,options={}){const response=await fetch(`${API}${path}`,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=await response.json();if(!response.ok)throw new Error(data.error||`Request failed (${response.status})`);return data}
function cash(value){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(value)||0)}function safe(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showTab(id,button){document.querySelectorAll('.content').forEach(el=>el.classList.toggle('active',el.id===id));document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el===button));if(id==='audit')loadAudit();if(id==='ledger')loadLedger()}
function say(message,error=false){const el=document.getElementById('page-message');el.textContent=message;el.className=`msg${error?' error':''}`}
async function loadLoans(){try{const loans=await api('/loans');const el=document.getElementById('loan-list');const awaiting=loans.filter(loan=>['pending','review_required','reviewing'].includes(loan.status));document.getElementById('stat-pending').textContent=awaiting.length;if(!loans.length){el.innerHTML='<div class="empty">No loan applications have been submitted.</div>';return}el.innerHTML=loans.map(loan=>`<article class="loan"><div class="loan-top"><div><div class="loan-id">${safe(loan.loanId)}</div><h2>${safe(loan.accountHolder)} · ${cash(loan.amount)}</h2><div class="meta">Purpose: ${safe(loan.purpose)}<br>Submitted ${new Date(loan.createdAt).toLocaleString()} · Status: ${safe(loan.status)}<br>Terms: ${loan.termMonths||12} months · ${cash(loan.monthlyPayment||0)}/month · total ${cash(loan.totalRepayment||0)}</div></div><span class="badge">${safe(loan.status)}</span></div>${loan.aiSummary?`<div class="recommendation"><b>AI: ${safe(loan.aiRecommendation)}<br>Advisory only</b><div>${safe(loan.aiSummary)}<ul>${loan.aiReasons.map(reason=>`<li>${safe(reason)}</li>`).join('')}</ul><span class="meta">Evidence: ${Number(loan.aiData.transactionCount)||0} recent transactions · balance ${cash((Number(loan.aiData.balanceCents)||0)/100)} · merchant sales ${Number(loan.aiData.merchantSalesCount)||0} · net sales ${cash((Number(loan.aiData.netSalesCents)||0)/100)}</span></div></div>`:'<div class="recommendation"><b>Review status</b><div>Risk review is still running or unavailable. No automated approval has occurred.</div></div>'}${loan.status==='approved'&&loan.payoutId?`<div class="decision"><span class="meta">PayPal payout awaiting settlement</span><button class="quiet" onclick="syncLoan('${safe(loan.loanId)}')">Check payout status</button></div>`:''}${['pending','review_required'].includes(loan.status)&&operator.role==='employee'?`<div class="decision"><input id="reason-${safe(loan.loanId)}" placeholder="Override/decision reason (required when overriding AI)"><button class="primary" onclick="decide('${safe(loan.loanId)}','approve')">Approve & pay out</button><button class="danger" onclick="decide('${safe(loan.loanId)}','reject')">Reject</button></div>`:''}</article>`).join('')}catch(error){say(error.message,true)}}
async function syncLoan(loanId){try{const result=await api(`/loans/${encodeURIComponent(loanId)}/payout/sync`,{method:'POST',body:'{}'});say(`Payout ${result.payoutStatus}; loan ${result.loanStatus}.`);await refreshAll()}catch(error){say(error.message,true)}}
async function decide(loanId,decision){const reason=document.getElementById(`reason-${loanId}`).value.trim();if(decision==='reject'&&!reason){say('Add the evidence-based rejection reason first.',true);return}if(!confirm(decision==='approve'?`Approve loan ${loanId} and initiate a PayPal payout?`:`Reject loan ${loanId}?`))return;try{await api(`/loans/${encodeURIComponent(loanId)}/${decision}`,{method:'POST',body:JSON.stringify(decision==='approve'?{overrideReason:reason}:{reason})});say(decision==='approve'?'Approved. PayPal payout is pending verified settlement.':'Loan rejected and reason recorded.');await refreshAll()}catch(error){say(error.message,true)}}
async function loadAudit(){try{const rows=await api('/audit');document.getElementById('audit-list').innerHTML=rows.length?rows.map(row=>`<div class="audit-row"><span>${new Date(row.createdAt).toLocaleString()}</span><span>${safe(row.actorRole)} · ${safe(row.actorId||'system')}</span><strong>${safe(row.action)}</strong><span>${safe(row.reason)}<br><span style="color:#738078">${safe(JSON.stringify(row.details))}</span></span></div>`).join(''):'<div class="empty">No audit events.</div>'}catch(error){say(error.message,true)}}
let ledgerGrid=null;
async function loadLedger(){try{const rows=await api('/transactions');const grid=window.agGrid;if(!grid?.createGrid)return say('Transaction grid failed to load. Refresh the page.',true);const options={theme:'legacy',rowData:rows,columnDefs:[{field:'timestamp',headerName:'Date',minWidth:170,valueFormatter:p=>new Date(p.value).toLocaleString()},{field:'accountHolder',headerName:'Account holder',minWidth:140},{field:'email',headerName:'Email',minWidth:190},{field:'type',headerName:'Type',minWidth:140},{field:'amount',headerName:'Amount',minWidth:110,valueFormatter:p=>cash(p.value)},{field:'status',headerName:'Status',minWidth:110},{field:'reason',headerName:'Description',minWidth:180},{field:'reference',headerName:'Provider reference',minWidth:210}],defaultColDef:{sortable:true,filter:true,resizable:true,flex:1},pagination:true,paginationPageSize:25,paginationPageSizeSelector:[25,50,100],animateRows:false};if(!ledgerGrid)ledgerGrid=grid.createGrid(document.getElementById('transaction-grid'),options);else ledgerGrid.setGridOption('rowData',rows)}catch(error){say(error.message,true)}}
async function togglePause(){try{const result=await api('/admin/agent-pause',{method:'POST',body:JSON.stringify({paused:!paused,reason:'Operator dashboard safety control'})});paused=result.paused;renderControls()}catch(error){say(error.message,true)}}
function renderControls(){
  const el=document.getElementById('controls');
  if(operator.role!=='monitor'){el.innerHTML='';return}
  // Build the monitor panel only once. refreshAll() runs every five seconds;
  // replacing innerHTML on every refresh used to erase in-progress staff forms.
  if(!document.getElementById('monitor-controls')){
    el.innerHTML=`<div id="monitor-controls">
      <div id="pause-panel" class="pause"><span><b id="pause-title"></b><br><span id="pause-description"></span></span><button id="pause-button" type="button" onclick="togglePause()"></button></div>
      <div class="account-list"><h2>Create loan-review staff account</h2><p class="meta">Creates an employee account for reviewing loan applications. This form is available only to a signed-in monitor.</p>
      <form id="staff-create-form" onsubmit="createStaffAccount(event)">
        <div class="account-row" style="grid-template-columns:repeat(3,minmax(0,1fr))">
          <label>Full name<br><input id="staff-name" name="name" autocomplete="name" required minlength="2" maxlength="100" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:5px"></label>
          <label>Email<br><input id="staff-email" name="email" type="email" autocomplete="email" required style="width:100%;padding:9px;border:1px solid var(--line);border-radius:5px"></label>
          <label>Password (10+ characters)<br><input id="staff-password" name="password" type="password" autocomplete="new-password" minlength="10" required style="width:100%;padding:9px;border:1px solid var(--line);border-radius:5px"></label>
        </div>
        <button class="primary" type="submit">Create employee account</button><div id="staff-create-status" class="msg" role="status" aria-live="polite"></div>
      </form></div></div>`;
  }
  const panel=document.getElementById('pause-panel');
  panel.className=`pause ${paused?'paused':''}`;
  document.getElementById('pause-title').textContent=paused?'Emergency pause is ON':'Disbursements operational';
  document.getElementById('pause-description').textContent=paused?'New loan payouts are blocked.':'Monitor can halt loan disbursements.';
  const button=document.getElementById('pause-button');
  button.className=paused?'primary':'danger';button.textContent=paused?'Resume payouts':'Pause payouts';
}
async function createStaffAccount(event){
  event.preventDefault();
  const form=document.getElementById('staff-create-form');
  const status=document.getElementById('staff-create-status');
  const button=form.querySelector('button[type=submit]');
  const name=document.getElementById('staff-name').value.trim();
  const email=document.getElementById('staff-email').value.trim();
  const password=document.getElementById('staff-password').value;
  status.className='msg';status.textContent='Creating employee account…';button.disabled=true;
  try{
    const result=await api('/admin/users/employee',{method:'POST',body:JSON.stringify({name,email,password,role:'employee'})});
    form.reset();status.className='msg';status.textContent=`Employee account created for ${result.email}. They can now sign in from the login page.`;
  }catch(error){status.className='msg error';status.textContent=error.message||'Could not create employee account.'}
  finally{button.disabled=false}
}
async function loadStaffAccounts(){try{const accounts=await api('/admin/accounts');const el=document.getElementById('staff-accounts');el.innerHTML=`<div class="account-list"><h2>Customer accounts · ${accounts.length}</h2>${accounts.length?accounts.map(account=>`<div class="account-row"><div><strong>${safe(account.ownerName)}</strong><br>${safe(account.email)} · ${safe(account.accountId)}</div><strong>${cash(account.balance)}</strong><span class="${account.control.status==='frozen'?'frozen-label':''}">${safe(account.control.status)}${account.control.reason?` · ${safe(account.control.reason)}`:''}</span>${operator.role==='monitor'?`<button class="${account.control.status==='frozen'?'primary':'danger'}" onclick="controlAccount('${safe(account.accountId)}',${account.control.status!=='frozen'})">${account.control.status==='frozen'?'Unfreeze':'Freeze account'}</button>`:''}</div>`).join(''):'<div class="empty">No customer accounts have registered yet.</div>'}</div>`}catch(error){say(error.message,true)}}
async function controlAccount(accountId,freeze){let reason='';if(freeze){reason=prompt('Reason for account freeze (recorded in the audit log):')||'';if(!reason.trim())return}else if(!confirm('Remove the account freeze?'))return;try{await api(`/admin/accounts/${encodeURIComponent(accountId)}/freeze`,{method:'POST',body:JSON.stringify({frozen:freeze,reason})});say(freeze?'Account frozen; outgoing wallet operations are blocked.':'Account freeze removed.');await loadStaffAccounts()}catch(error){say(error.message,true)}}
async function refreshAll(){try{const summary=await api('/bank/summary');document.getElementById('stat-accounts').textContent=summary.accountCount;document.getElementById('stat-balance').textContent=cash(summary.totalBalance);document.getElementById('stat-pending').textContent=summary.pendingLoans;document.getElementById('stat-loans').textContent=summary.loansGiven;paused=summary.agentPaused;renderControls();await Promise.all([loadLoans(),loadStaffAccounts()])}catch(error){say(error.message,true)}}
async function signOut(){try{await api('/auth/logout',{method:'POST',body:'{}'})}finally{location.href='login.html'}}
(async()=>{try{const result=await api('/auth/me');operator=result.user;if(!operator||!['employee','monitor'].includes(operator.role)){location.href='login.html';return}document.getElementById('identity').textContent=`${operator.name} · ${operator.role}`;await refreshAll()}catch{location.href='login.html'}})();
setInterval(()=>{if(operator&&document.visibilityState==='visible'){refreshAll();if(document.getElementById('audit').classList.contains('active'))loadAudit();if(document.getElementById('ledger').classList.contains('active'))loadLedger()}},5000);
</script></body></html>
