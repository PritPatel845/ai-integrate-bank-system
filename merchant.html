<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Current | Merchant</title>
    <style>
      :root {
        --bg-forest: #061c11;
        --bg-deep: #0c2d20;
        --panel: rgba(14, 39, 29, 0.78);
        --panel-soft: rgba(17, 48, 35, 0.58);
        --panel-alt: rgba(22, 65, 47, 0.8);
        --line: rgba(193, 228, 186, 0.2);
        --mint: #dfffe7;
        --green-1: #a8f0b5;
        --green-2: #6bd68d;
        --green-3: #2ca96d;
        --green-4: #16724b;
        --green-5: #0d3a2d;
        --amber: #f2db8a;
        --red: #ff7462;
        --shadow: 0 20px 45px rgba(3, 15, 10, 0.45);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Inter, "Segoe UI", sans-serif;
        color: var(--mint);
        background:
          radial-gradient(circle at top left, rgba(97, 198, 120, 0.25), transparent 30%),
          radial-gradient(circle at bottom right, rgba(166, 240, 181, 0.18), transparent 30%),
          linear-gradient(135deg, var(--bg-forest), var(--bg-deep));
      }

      body {
        padding: 24px;
      }

      a { color: var(--green-1); }

      .page {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        gap: 22px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 22px;
        border-radius: 20px;
        background: rgba(10, 25, 18, 0.5);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--mint);
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        background: linear-gradient(135deg, var(--green-2), var(--green-4));
        box-shadow: inset 0 0 18px rgba(255,255,255,0.2);
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .identity {
        font-size: 0.96rem;
        color: rgba(223, 255, 231, 0.8);
      }

      .btn {
        cursor: pointer;
        border: none;
        border-radius: 12px;
        padding: 0.8rem 1.2rem;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-1px) scale(1.01);
        box-shadow: 0 12px 18px rgba(30, 87, 60, 0.2);
      }

      .btn:active { transform: translateY(0); }

      .btn-primary {
        background: linear-gradient(135deg, var(--green-2), var(--green-3));
        color: #022912;
      }

      .btn-secondary {
        background: rgba(255,255,255,0.04);
        color: var(--mint);
        border: 1px solid var(--line);
      }

      .btn-ghost {
        background: rgba(157, 253, 178, 0.08);
        color: var(--mint);
        border: 1px solid rgba(157, 253, 178, 0.2);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(180px, 1fr));
        gap: 18px;
      }

      .card {
        background: linear-gradient(180deg, var(--panel-soft), rgba(9, 25, 18, 0.72));
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .metric {
        padding: 20px 22px;
      }

      .metric-label {
        display: block;
        color: rgba(223, 255, 231, 0.72);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.72rem;
        margin-bottom: 8px;
      }

      .metric-value {
        font-size: clamp(1.6rem, 3vw, 2.5rem);
        font-weight: 800;
      }

      .layout {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 22px;
      }

      .panel {
        padding: 22px;
      }

      h2 {
        margin: 0 0 16px;
        font-size: 1.1rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: rgba(223, 255, 231, 0.86);
      }

      .form-grid {
        display: grid;
        gap: 14px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      label {
        font-size: 0.8rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: rgba(223,255,231,0.7);
      }

      input, textarea {
        width: 100%;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(5, 26, 18, 0.7);
        color: var(--mint);
        padding: 0.9rem 0.95rem;
        font: inherit;
      }

      textarea {
        min-height: 96px;
        resize: vertical;
      }

      input::placeholder, textarea::placeholder {
        color: rgba(223, 255, 231, 0.42);
      }

      .status {
        margin-top: 12px;
        border-radius: 12px;
        padding: 0.8rem 0.95rem;
        font-size: 0.92rem;
        background: rgba(155, 246, 170, 0.08);
        color: var(--mint);
        border: 1px solid rgba(155, 246, 170, 0.2);
        min-height: 46px;
        display: flex;
        align-items: center;
      }

      .status.error {
        background: rgba(255, 116, 98, 0.08);
        border-color: rgba(255, 116, 98, 0.25);
      }

      .list {
        display: grid;
        gap: 14px;
      }

      .empty {
        border: 1px dashed rgba(223,255,231,0.2);
        border-radius: 16px;
        padding: 20px;
        color: rgba(223,255,231,0.72);
        background: rgba(255,255,255,0.01);
      }

      .link-item, .sale-item {
        display: grid;
        gap: 12px;
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 16px;
        animation: floatIn 0.28s ease;
      }

      .link-topline, .sale-topline {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }

      .link-title {
        font-size: 1.1rem;
        font-weight: 700;
      }

      .amount-pill {
        padding: 0.45rem 0.7rem;
        border-radius: 999px;
        background: rgba(168, 240, 181, 0.12);
        border: 1px solid rgba(168, 240, 181, 0.2);
        color: var(--green-1);
        font-weight: 700;
      }

      .meta {
        color: rgba(223,255,231,0.75);
        font-size: 0.92rem;
        line-height: 1.6;
        word-break: break-word;
      }

      .link-actions, .sale-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .qr {
        width: 110px;
        height: 110px;
        object-fit: contain;
        border-radius: 14px;
        padding: 8px;
        background: rgba(255,255,255,0.95);
        border: 1px solid rgba(20, 60, 42, 0.2);
      }

      .sale-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }

      .sale-reason {
        font-weight: 600;
      }

      .sale-status {
        font-size: 0.8rem;
        color: rgba(223,255,231,0.7);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        padding: 0.35rem 0.65rem;
        border-radius: 999px;
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border: 1px solid rgba(223,255,231,0.2);
      }

      .pill.success {
        background: rgba(73, 210, 120, 0.09);
        color: var(--green-1);
      }

      .pill.warn {
        background: rgba(242,219,138,0.08);
        color: var(--amber);
      }

      .profile-grid {
        display: grid;
        gap: 16px;
      }

      @keyframes floatIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 900px) {
        .stats, .layout {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 560px) {
        body {
          padding: 14px;
        }

        .topbar {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }

        .topbar-actions {
          width: 100%;
          justify-content: space-between;
        }

        .link-topline, .sale-row {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">C</span>
          Current / Merchant
        </div>
        <div class="topbar-actions">
          <div class="identity" id="identity">Loading merchant…</div>
          <button id="signout-btn" class="btn btn-secondary" type="button">Sign out</button>
        </div>
      </header>

      <section class="stats">
        <div class="card metric">
          <span class="metric-label">Sales</span>
          <div class="metric-value" id="sales-count">0</div>
        </div>
        <div class="card metric">
          <span class="metric-label">Gross sales</span>
          <div class="metric-value" id="gross-sales">$0.00</div>
        </div>
        <div class="card metric">
          <span class="metric-label">Payout email</span>
          <div class="metric-value" id="profile-email" style="font-size: 1.2rem; line-height: 1.5;">Not set</div>
        </div>
      </section>

      <section class="layout">
        <div class="card panel">
          <h2>Create Payment Link</h2>
          <form id="link-form" class="form-grid">
            <div class="field">
              <label for="title">Title</label>
              <input id="title" name="title" type="text" placeholder="Forest tea box" required />
            </div>
            <div class="field">
              <label for="description">Description</label>
              <textarea id="description" name="description" placeholder="Fresh botanical blend, 100% organic and ready to ship."></textarea>
            </div>
            <div class="field">
              <label for="amount">Amount (USD)</label>
              <input id="amount" name="amount" type="number" step="0.01" min="0.01" placeholder="49.99" required />
            </div>
            <button class="btn btn-primary" type="submit">Generate payment link</button>
          </form>
          <div id="link-status" class="status">Ready to create your next payment flow.</div>
        </div>

        <div class="card panel">
          <h2>PayPal profile</h2>
          <form id="profile-form" class="profile-grid">
            <div class="field">
              <label for="paypal-email">Payout email</label>
              <input id="paypal-email" name="paypalEmail" type="email" placeholder="merchant@example.com" />
            </div>
            <button class="btn btn-ghost" type="submit">Save payout email</button>
          </form>
          <div id="profile-status" class="status">Your saved payout email updates future payouts and payout checks.</div>
        </div>
      </section>

      <section class="card panel">
        <h2>Payment links</h2>
        <div id="links" class="list"></div>
      </section>

      <section class="card panel">
        <h2>Recent sales</h2>
        <div id="sales" class="list"></div>
      </section>
    </div>

    <script>
      const API = '/api';
      let merchant = null;

      function cash(value) {
        return new Intl.NumberFormat('en-US', {style: 'currency', currency: 'USD'}).format(Number(value) || 0);
      }

      function safe(value) {
        return String(value ?? '').replace(/[&<>"']/g, c => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[c]));
      }

      function setStatus(id, text, error = false) {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = text;
        el.className = `status${error ? ' error' : ''}`;
      }

      async function api(path, options = {}) {
        const response = await fetch(`${API}${path}`, {
          credentials: 'same-origin',
          ...options,
          headers: {
            'Content-Type': 'application/json',
            ...(options.headers || {})
          }
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
        return data;
      }

      function playTone(type = 'sine', frequency = 620, duration = 0.12) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;

        try {
          const ctx = new AudioCtx();
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();
          oscillator.type = type;
          oscillator.frequency.value = frequency;
          gain.gain.value = 0.038;
          oscillator.connect(gain);
          gain.connect(ctx.destination);
          oscillator.start();
          oscillator.stop(ctx.currentTime + duration);
          oscillator.onended = () => ctx.close();
        } catch (err) {
          // Silent fallback if audio context is not available in the browser.
        }
      }

      function playSuccessSound() {
        playTone('triangle', 540, 0.12);
        setTimeout(() => playTone('triangle', 680, 0.14), 90);
      }

      function playErrorSound() {
        playTone('sawtooth', 220, 0.16);
      }

      function renderLinks(links = []) {
        const container = document.getElementById('links');
        if (!links.length) {
          container.innerHTML = '<div class="empty">No payment links yet. Create one to start collecting sandbox sales.</div>';
          return;
        }

        container.innerHTML = links.map(link => `
          <article class="link-item">
            <div class="link-topline">
              <div class="link-title">${safe(link.title)}</div>
              <div class="amount-pill">${cash(link.amount)}</div>
            </div>
            <div class="meta">
              ${safe(link.description || 'No description provided')}<br>
              ${Number(link.salesCount || 0)} sale(s) · ${cash(link.sales || 0)}
            </div>
            <div class="link-actions">
              <button class="btn btn-secondary" type="button" onclick="copyLink('${safe(link.checkoutUrl)}')">Copy link</button>
              <button class="btn btn-ghost" type="button" onclick="openLink('${safe(link.checkoutUrl)}')">Open checkout</button>
            </div>
            <div class="meta">
              <a href="${safe(link.checkoutUrl)}" target="_blank" rel="noopener">${safe(link.checkoutUrl)}</a>
            </div>
            <img class="qr" data-qr="${safe(link.linkId)}" alt="QR code for ${safe(link.title)}" />
          </article>
        `).join('');

        links.forEach(async link => {
          try {
            const image = await api(`/merchant/payment-links/${encodeURIComponent(link.linkId)}/qr`);
            const img = document.querySelector(`[data-qr="${CSS.escape(link.linkId)}"]`);
            if (img && image && image.dataUrl) img.src = image.dataUrl;
          } catch (err) {
            // Ignore QR generation issues while still rendering the page.
          }
        });
      }

      function renderSales(transactions = []) {
        const container = document.getElementById('sales');
        if (!transactions.length) {
          container.innerHTML = '<div class="empty">No sales have completed yet.</div>';
          return;
        }

        container.innerHTML = transactions.map(sale => `
          <div class="sale-item">
            <div class="sale-row">
              <div>
                <div class="sale-reason">${safe(sale.reason || 'Merchant sale')}</div>
                <div class="sale-status">${new Date(sale.timestamp).toLocaleString()} · ${safe(sale.status)}</div>
              </div>
              <div class="amount-pill">${cash(sale.amount)}</div>
            </div>
            <div class="sale-actions">
              <span class="pill ${sale.status === 'COMPLETED' ? 'success' : 'warn'}">${safe(sale.status)}</span>
              ${sale.type === 'merchant_sale' && sale.status === 'COMPLETED' ? `<button class="btn btn-secondary" type="button" onclick="refundSale('${safe(sale.reference)}')">Refund</button>` : ''}
            </div>
          </div>
        `).join('');
      }

      async function refresh() {
        try {
          const [links, dashboard, accounts] = await Promise.all([
            api('/merchant/payment-links'),
            api('/merchant/dashboard'),
            api('/accounts')
          ]);

          document.getElementById('sales-count').textContent = dashboard.salesCount ?? 0;
          document.getElementById('gross-sales').textContent = cash(dashboard.grossSales || 0);

          const account = accounts[0] || {};
          document.getElementById('profile-email').textContent = account.paypalEmail || 'Not set';
          document.getElementById('paypal-email').value = account.paypalEmail || '';

          renderLinks(links || []);
          renderSales(dashboard.transactions || []);
        } catch (error) {
          if (error.message === 'Sign in required') {
            location.href = 'login.html';
            return;
          }
          setStatus('link-status', error.message, true);
          playErrorSound();
        }
      }

      async function createLink(event) {
        event.preventDefault();
        const title = document.getElementById('title').value.trim();
        const description = document.getElementById('description').value.trim();
        const amount = Number(document.getElementById('amount').value);

        if (!title || !Number.isFinite(amount) || amount <= 0) {
          setStatus('link-status', 'Please enter a valid title and amount before creating a payment link.', true);
          playErrorSound();
          return;
        }

        try {
          const link = await api('/merchant/payment-links', {
            method: 'POST',
            body: JSON.stringify({ title, description, amount })
          });

          setStatus('link-status', `Payment link created: ${link.checkoutUrl}`);
          playSuccessSound();
          event.target.reset();
          await refresh();
        } catch (error) {
          setStatus('link-status', error.message, true);
          playErrorSound();
        }
      }

      async function savePaypalEmail(event) {
        event.preventDefault();
        const email = document.getElementById('paypal-email').value.trim();

        try {
          await api('/profile/paypal-email', {
            method: 'PATCH',
            body: JSON.stringify({ paypalEmail: email })
          });
          setStatus('profile-status', 'Payout email saved successfully.');
          playSuccessSound();
          await refresh();
        } catch (error) {
          setStatus('profile-status', error.message, true);
          playErrorSound();
        }
      }

      async function refundSale(captureId) {
        if (!confirm('Refund this completed PayPal sandbox sale?')) return;

        try {
          await api(`/merchant/sales/${encodeURIComponent(captureId)}/refund`, { method: 'POST', body: '{}' });
          setStatus('link-status', 'Refund started and the sales dashboard is refreshing.');
          playSuccessSound();
          await refresh();
        } catch (error) {
          setStatus('link-status', error.message, true);
          playErrorSound();
        }
      }

      function copyLink(url) {
        if (!url) return;
        navigator.clipboard.writeText(url).then(() => {
          setStatus('link-status', 'Checkout link copied to clipboard.');
          playSuccessSound();
        }).catch(() => {
          setStatus('link-status', 'Clipboard access failed. You can still copy the link manually.', true);
        });
      }

      function openLink(url) {
        if (!url) return;
        window.open(url, '_blank', 'noopener');
      }

      async function signOut() {
        try {
          await api('/auth/logout', { method: 'POST', body: '{}' });
        } finally {
          location.href = 'login.html';
        }
      }

      (async () => {
        try {
          const result = await api('/auth/me');
          merchant = result.user;

          if (!merchant || merchant.role !== 'merchant') {
            location.href = 'login.html';
            return;
          }

          document.getElementById('identity').textContent = `Signed in as ${merchant.email || merchant.name || 'Merchant'}`;
          document.getElementById('link-form').addEventListener('submit', createLink);
          document.getElementById('profile-form').addEventListener('submit', savePaypalEmail);
          document.getElementById('signout-btn').addEventListener('click', signOut);
          await refresh();
        } catch (error) {
          if (error.message === 'Sign in required') {
            location.href = 'login.html';
            return;
          }
          setStatus('link-status', error.message, true);
          playErrorSound();
        }
      })();
    </script>
  </body>
</html>
