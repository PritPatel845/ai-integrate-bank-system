<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pay securely | Current</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{font-family:Manrope,sans-serif;color:#18231d;background:#edf2ed;--green:#176c4b;--line:#dae3dc;--muted:#738078;--mono:'DM Mono',monospace}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.checkout{width:min(100%,470px);background:white;border:1px solid var(--line);border-radius:9px;padding:27px}.brand{font-weight:800}.mark{display:inline-grid;place-items:center;background:#d4f27a;color:var(--green);border-radius:7px;width:27px;height:27px;margin-right:7px}.label{margin-top:35px;color:var(--green);font:11px var(--mono);text-transform:uppercase}.title{font-size:24px;margin:8px 0}.description,.seller{font-size:12px;color:var(--muted);line-height:1.6}.amount{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0;margin:24px 0;display:flex;justify-content:space-between;align-items:center}.amount strong{font:23px var(--mono)}button{width:100%;border:0;border-radius:5px;background:#176c4b;color:white;padding:14px;font-weight:800;cursor:pointer}.button-secondary{background:#eff3ef;color:#27342c;margin-top:8px}.notice{display:none;margin-top:12px;padding:11px;border-radius:5px;background:#edf5ef;color:var(--green);font-size:12px;line-height:1.5}.notice.show{display:block}.notice.error{background:#faecea;color:#a1382d}.fine{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);line-height:1.6}
</style></head><body><main class="checkout"><div class="brand"><span class="mark">C</span>Current checkout</div><div class="label">Pay merchant</div><h1 class="title" id="title">Loading item…</h1><p class="description" id="description"></p><div class="seller" id="merchant"></div><div class="amount"><span>Total · USD</span><strong id="amount">$0.00</strong></div><button id="pay-button" onclick="pay()">Continue with PayPal</button><button id="back-button" class="button-secondary" hidden onclick="location.href='/checkout/'+encodeURIComponent(linkId)">Return to checkout</button><div class="notice" id="notice"></div><div class="fine">Payment is processed by PayPal sandbox. Do not enter your PayPal password on this page. Your card and account details are handled by PayPal.</div></main><script>
const API='/api';const linkId=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');let linkInfo=null;
async function api(path,options={}){const response=await fetch(`${API}${path}`,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=await response.json();if(!response.ok)throw new Error(data.error||'Payment request failed');return data}function show(text,error=false){const el=document.getElementById('notice');el.textContent=text;el.className=`notice show${error?' error':''}`}
async function load(){try{const params=new URLSearchParams(location.search);if(params.get('paypal')==='return'&&params.get('token')){document.getElementById('pay-button').disabled=true;const result=await api(`/public/orders/${encodeURIComponent(params.get('token'))}/capture`,{method:'POST',body:'{}'});history.replaceState({},'',location.pathname);show(`Payment ${result.status.toLowerCase()}. ${result.merchant||''} received ${new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(result.amount||0)}.`);document.getElementById('pay-button').hidden=true;return}if(params.get('paypal')==='cancel'){history.replaceState({},'',location.pathname);show('Checkout was cancelled. No payment was recorded.',true)}linkInfo=await api(`/public/payment-links/${encodeURIComponent(linkId)}`);document.getElementById('title').textContent=linkInfo.title;document.getElementById('description').textContent=linkInfo.description;document.getElementById('merchant').textContent=`Sold by ${linkInfo.merchant}`;document.getElementById('amount').textContent=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(linkInfo.amount)}catch(error){document.getElementById('pay-button').disabled=true;show(error.message,true)}}
async function pay(){try{const order=await api(`/public/payment-links/${encodeURIComponent(linkId)}/order`,{method:'POST',body:'{}'});if(!order.approveUrl)throw new Error('PayPal approval URL unavailable');location.href=order.approveUrl}catch(error){show(error.message,true)}}load();
</script></body></html>
