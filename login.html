<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sovereign Wallet - Portal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .container { background: white; border-radius: 20px; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3); overflow: hidden; max-width: 900px; width: 100%; display: grid; grid-template-columns: 1fr 1fr; }
    .left-side { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 60px 40px; display: flex; flex-direction: column; justify-content: center; text-align: center; }
    .right-side { padding: 60px 40px; display: flex; flex-direction: column; justify-content: center; }
    .tabs { display: flex; gap: 0; margin-bottom: 30px; border-bottom: 2px solid #e9ecef; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; cursor: pointer; font-size: 16px; font-weight: 600; color: #999; border-bottom: 3px solid transparent; }
    .tab-btn.active { color: #667eea; border-bottom-color: #667eea; }
    .form-container { display: none; }
    .form-container.active { display: block; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border: 2px solid #e9ecef; border-radius: 8px; font-size: 14px; }
    .btn { padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; }
    .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
    @media (max-width: 768px) { .container { grid-template-columns: 1fr; } .left-side { display: none; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-side">
      <h1>🏦 Sovereign Wallet</h1>
      <p>Secure, Autonomous Financial Intelligence</p>
    </div>
    <div class="right-side">
      <div class="tabs">
        <button class="tab-btn active" id="tab-signin">🔑 Sign In</button>
        <button class="tab-btn" id="tab-signup">📝 Sign Up</button>
      </div>
      <form class="form-container active" id="signin-form">
        <h2>Welcome Back</h2>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="signinEmail" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signinPassword" required />
        </div>
        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>
      <form class="form-container" id="signup-form">
        <h2>Create Account</h2>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="signupName" required />
        </div>
        <div class="form-group">
          <label>Account type</label>
          <select id="signupRole">
            <option value="customer">Personal wallet</option>
            <option value="merchant">Merchant</option>
          </select>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="signupEmail" required />
        </div>
        <div class="form-group">
          <label>PayPal email</label>
          <input type="email" id="signupPaypalEmail" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signupPassword" required />
        </div>
        <button type="submit" class="btn btn-primary">Create Account</button>
      </form>
    </div>
  </div>
  <script src="/client-main.js"></script>
  <script>
    document.getElementById('tab-signin').onclick = () => {
      document.getElementById('signin-form').classList.add('active');
      document.getElementById('signup-form').classList.remove('active');
      document.getElementById('tab-signin').classList.add('active');
      document.getElementById('tab-signup').classList.remove('active');
    };
    document.getElementById('tab-signup').onclick = () => {
      document.getElementById('signup-form').classList.add('active');
      document.getElementById('signin-form').classList.remove('active');
      document.getElementById('tab-signup').classList.add('active');
      document.getElementById('tab-signin').classList.remove('active');
    };
  </script>
</body>
</html>
